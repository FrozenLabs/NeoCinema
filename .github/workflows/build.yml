name: Build All Modules and Platforms

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout with Submodules
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive

      - uses: gradle/wrapper-validation-action@v1.1.0

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4.0.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build Everything
        run: ./gradlew :bukkit:build :fabric:build shadowJar

      - name: Upload Bukkit JAR
        uses: actions/upload-artifact@v4.3.0
        with:
          name: neocinema-dev-bukkit
          path: bukkit/build/libs/*.jar

      - name: Upload NeoCinema JAR
        uses: actions/upload-artifact@v4.3.0
        with:
          name: neocinema-dev-universal
          path: fabric/build/libs/*universal.jar
